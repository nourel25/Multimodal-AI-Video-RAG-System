name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements/*.txt
      # ML models are not needed: the tests use deterministic fakes for them.
      - run: pip install -r src/requirements/base.txt -r src/requirements/dev.txt
      - run: ruff check src tests
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker/docker-compose.yml config --quiet
