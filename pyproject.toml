[project]
name = "multimodal-video-rag"
version = "2.0.0"
description = "Multimodal RAG over YouTube videos: transcripts + visual frames, hybrid retrieval, timestamped citations."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval", "ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
